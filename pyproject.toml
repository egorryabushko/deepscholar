[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deepscholar"
version = "0.1.0"
description = "A citation-first research agent over arXiv and OpenAlex"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "huggingface-hub>=0.27,<2",
  "pydantic-settings>=2.6,<3",
  "pymupdf>=1.24,<2",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/deepscholar"]

[tool.pytest.ini_options]
addopts = "-q --cov=deepscholar --cov-report=term-missing"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
